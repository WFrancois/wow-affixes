; php2shell stopgap: app WITHOUT file uploads
; Stopgap until PHP is patched; removing it later is optional except memory_limit

; CVE-2026-109619: stale global state via session upload progress
session.upload_progress.enabled = 0

; No uploads needed: turn them off entirely
file_uploads = Off
upload_max_filesize = 2M
max_file_uploads = 0

; CVE-2026-109618: limit request size (PHP team recommends 8M without uploads)
post_max_size = 8M
max_input_vars = 1000
max_input_nesting_level = 32

; PHP 8.5 only: blocks the confirmed fatal-backtrace path (unknown setting on older versions)
; fatal_error_backtraces = 0
